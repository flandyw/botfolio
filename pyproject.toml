[project]
name = "botfolio"
version = "1.0.0"
description = "News-driven Alpaca paper trading and supervision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pandas-market-calendars>=4.4",
    "python-dotenv>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-requests", "types-PyYAML"]

[project.scripts]
botfolio = "botfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B023", "SIM102", "SIM108"]
