# Default watchlist traded by all strategies; editable at runtime from the Control page.
symbols: [
  # ETFs
  SPY, QQQ, IWM, DIA, VTI, VOO, VGT, XLK, SOXX, VUG, SMH, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLC, XLB,
  XLRE, EFA, EEM, TLT, GLD, QQQM,
  # Technology
  AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, ORCL, CRM, ADBE, INTC, CSCO, QCOM, TXN, MU,
  AMAT, LRCX, KLAC, ASML, TSM, ARM, PLTR, SNOW, NOW, PANW, CRWD, SHOP, UBER, ABNB, PYPL, COIN, HOOD, SOFI,
  MSTR, SMCI, DELL, IBM, MRVL, ANET, INTU, APP,
  # Financials
  JPM, BAC, WFC, GS, MS, C, V, MA, AXP, BLK, SCHW, BRK.B,
  # Health care
  UNH, JNJ, LLY, PFE, MRK, ABBV, TMO, ABT, AMGN, GILD, ISRG,
  # Energy, consumer, and communications
  XOM, CVX, COP, WMT, COST, HD, LOW, TGT, MCD, SBUX, NKE, KO, PEP, PG, DIS, CMCSA, T, VZ, TMUS,
  # Industrials and autos
  BA, CAT, DE, GE, HON, LMT, RTX, UPS, F, GM, RIVN, BABA, BKNG,
]
# Watchlist ETFs eligible for overnight ETF trend and rotation strategies.
# SPY and QQQ are reserved for intraday momentum (one strategy per symbol); VOO and QQQM track the same indexes.
etfs: [QQQM, IWM, DIA, VTI, VOO, VGT, XLK, SOXX, VUG, SMH, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLC, XLB,
       XLRE, EFA, EEM, TLT, GLD]
data:
  feed: iex
# Every strategy routes real paper orders to Alpaca Paper. Only one strategy holds a symbol at a time.
strategies:
  news:       # AI news evaluation: bracket order (1% stop, 2R target) with timed exit
    {enabled: true, max_positions: 5, position_pct: 25, risk_pct: 1}
  momentum:   # 30-minute noise-band breakout in `symbols` (long/short), stop at far band, flat by close
    {enabled: true, symbols: [SPY, QQQ], max_positions: 2, position_pct: 25, risk_pct: 0.5, lookback: 14}
  etf_trend:  # Hold each ETF above its 200-day average; allocation split equally across `etfs`
    {enabled: true, allocation_pct: 50, sma_days: 200, band_pct: 1}
  etf_rotation:  # Hold the top ETFs by 1/3/6/12-month return until they drop out of the top `keep`
    {enabled: true, allocation_pct: 40, top: 5, keep: 10, sma_days: 200}
  cash_park:  # Park idle cash from overnight strategies in a Treasury-bill ETF
    {enabled: true, symbol: BOXX, reserve_pct: 5, band_pct: 5}
