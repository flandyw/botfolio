# Ubuntu VPS deployment:  docker compose up -d --build
# Credentials come from .env (never baked into the image).
services:
  bot:
    build: .
    image: botfolio:latest
    container_name: botfolio-bot
    command: ["botfolio", "events", "watch"]
    env_file: .env
    environment:
      BOTFOLIO_DB_PATH: /app/data/botfolio.sqlite
      BOTFOLIO_LOG_JSON: "true"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "botfolio", "health", "--max-age", "900"]
      interval: 5m
      timeout: 30s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  api:
    image: botfolio:latest
    depends_on: [bot]
    container_name: botfolio-api
    env_file: .env
    command: ["botfolio", "web", "--host", "0.0.0.0", "--port", "8600"]
    environment:
      BOTFOLIO_DB_PATH: /app/data/botfolio.sqlite
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    build: ./web
    image: botfolio-web:latest
    depends_on: [api]
    container_name: botfolio-web
    env_file: .env
    environment:
      BOTFOLIO_API_URL: http://api:8600
      HOST: 0.0.0.0
    # Bound to localhost: reach it through an SSH tunnel (ssh -L 8601:localhost:8601 user@vps)
    # or Tailscale. Set BOTFOLIO_DASHBOARD_PASSWORD before exposing it any further.
    ports:
      - "127.0.0.1:8601:8601"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
